name: GAS Global Namespace Check

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  gas-global-namespace:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check GAS global namespace
        run: node scripts/test-gas-global-namespace.js
