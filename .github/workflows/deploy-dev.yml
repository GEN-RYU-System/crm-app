name: Deploy to DEV

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: crm-app-dev-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve and verify deploy commit
        id: target
        run: |
          set -o pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            target_sha="${{ github.sha }}"
          else
            target_sha=$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/git/ref/heads/develop" \
              | jq --raw-output '.object.sha')
          fi

          if ! curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${target_sha}/pulls" \
            | jq --exit-status --arg base "develop" \
              '.[] | select(.merged_at != null and .base.ref == $base)' \
              > /dev/null; then
            echo "::error::DEV deployment requires a GitHub merged PR with base=develop."
            exit 1
          fi

          echo "sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore .clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          # 書き込み確認（値は出さない）
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('clasprc OK, keys:', list(d.keys()))" ~/.clasprc.json

      - name: Generate .clasp.json
        env:
          SCRIPT_ID_DEV: ${{ secrets.SCRIPT_ID_DEV }}
        run: |
          printf '{"scriptId":"%s","rootDir":"src"}\n' "$SCRIPT_ID_DEV" > .clasp.json
          echo "scriptId: $(python3 -c "import json; print(json.load(open('.clasp.json'))['scriptId'][:8] + '...')")"

      - name: Push to DEV
        run: clasp push --force
