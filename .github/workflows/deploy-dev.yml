name: Deploy to DEV

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore .clasprc.json
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          # 書き込み確認（値は出さない）
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print('clasprc OK, keys:', list(d.keys()))" ~/.clasprc.json

      - name: Generate .clasp.json
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID_DEV }}
        run: |
          printf '{"scriptId":"%s","rootDir":"src"}\n' "$SCRIPT_ID" > .clasp.json
          echo "scriptId: $(python3 -c "import json; print(json.load(open('.clasp.json'))['scriptId'][:8] + '...')")"

      - name: Push to DEV
        run: clasp push --force
