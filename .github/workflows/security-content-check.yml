name: Security Content Check

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install verified gitleaks CLI
        env:
          GITLEAKS_VERSION: 8.18.4
          GITLEAKS_SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --status
          tar -xzf "$archive" gitleaks
          chmod +x gitleaks

      - name: Scan secrets
        run: ./gitleaks detect --source . --no-banner --redact=100

  sensitive-content:
    name: Sensitive Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check real data patterns
        env:
          SENSITIVE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-sensitive-content.mjs

      - name: Check configured secret patterns
        env:
          SECRET_SCAN_PATTERNS: ${{ secrets.SECRET_SCAN_PATTERNS }}
        shell: bash
        run: |
          if [ -z "${SECRET_SCAN_PATTERNS:-}" ]; then
            echo "::warning::SECRET_SCAN_PATTERNS is not configured; configured-pattern scan skipped."
            exit 0
          fi

          pattern_file="$(mktemp)"
          hits_file="$(mktemp)"
          trap 'rm -f "$pattern_file" "$hits_file"' EXIT
          printf '%s\n' "$SECRET_SCAN_PATTERNS" > "$pattern_file"

          has_hits=0
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            [ -z "$pattern" ] && continue
            if git grep -n -F -- "$pattern" > "$hits_file"; then
              cut -d: -f1,2 "$hits_file"
              has_hits=1
            else
              grep_status=$?
              if [ "$grep_status" -ne 1 ]; then
                exit "$grep_status"
              fi
            fi
          done < "$pattern_file"

          if [ "$has_hits" -ne 0 ]; then
            exit 1
          fi
