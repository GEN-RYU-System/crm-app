name: Security Content Check

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sensitive-content:
    name: Sensitive Content
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check real data patterns
        env:
          SENSITIVE_CONTENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-sensitive-content.mjs
