name: Detect Direct Push to Protected Branches

# ⚠️ このワークフローは「検知・記録用」です。
#    push を物理的に阻止するものではありません（GitHub Free private repo の制約）。
#    本丸の保護は .githooks/pre-push (ローカル) と
#    shingo-ops/bay-auto の Branch Protection (server-side) です。
#
# 直 push が来た場合: CI が赤になり、履歴に残ります。
# 対象: main / develop への、同じブランチをbaseとするGitHub上のマージ済みPR以外のpush

on:
  push:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  detect-direct-push:
    runs-on: ubuntu-latest
    steps:
      - name: Require GitHub merged PR for pushed branch
        run: |
          set -o pipefail
          if ! curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq --exit-status --arg base "${GITHUB_REF_NAME}" \
              '.[] | select(.merged_at != null and .base.ref == $base)' \
              > /dev/null; then
            echo "::error::Push to ${GITHUB_REF_NAME} is not associated with a GitHub merged PR whose base is ${GITHUB_REF_NAME}."
            exit 1
          fi
          echo "OK: GitHub merged PR for base=${GITHUB_REF_NAME} confirmed"
